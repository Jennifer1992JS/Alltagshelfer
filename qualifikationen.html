<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qualifikationen & Nachweise – Alltagsfreund Jenny</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #704882;
      --primary-dark: #55147a;
      --primary-light: #b755e0;
      --accent: #d6c1cb;
      --grad: linear-gradient(135deg, #2f1f47, #4b1252);
      --bg-warm: #c2a5bb;
      --bg-cream: #f2ebeb;
      --text: #2b143b;
      --text-muted: #362357;
      --border: #eee1f5;
      --white: #fff;
    }
    
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    
    body { 
      font-family: 'DM Sans', sans-serif; 
      background-color: #fdfafb;
      color: var(--text); 
      font-size: 18px; 
      line-height: 1.7; 
    }

    /* NAVIGATION */
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(255,253,253,0.96); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); height: 110px; padding: 0 52px; display: flex; align-items: center; justify-content: space-between; }
    .nav-logo { display: flex; align-items: center; gap: 16px; text-decoration: none; }
    .nav-logo img { height: 80px; width: auto; border-radius: 6px; object-fit: contain; }
    .nav-logo-text { font-size: 24px; font-weight: 700; line-height: 1.2; }
    .nav-logo-text strong { display: block; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .nav-logo-text small { font-size: 15px; color: var(--text-muted); font-weight: 500; letter-spacing: .8px; }
    .nav-links { display: flex; gap: 16px; list-style: none; align-items: center; }
