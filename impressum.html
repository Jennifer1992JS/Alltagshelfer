<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alltagsfreund Jenny – Haushalt & Nachbarschaftshilfe</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --v:#6b21d6; --v-d:#531aab; --p:#d946a8; --warm:#fdf4ff; --cream:#fff9fe;
      --text:#2d1a4a; --text-s:#5a3f8a; --border:#e9d5f7;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'DM Sans',sans-serif; background:var(--cream); color:var(--text); line-height:1.7; }
    .container { max-width: 1140px; margin: 0 auto; padding: 0 32px; }

    /* NAV */
    nav { position:fixed; top:0; width:100%; z-index:100; background:rgba(255,249,254,.95); backdrop-filter:blur(10px); border-bottom:1px solid var(--border); height:70px; display:flex; align-items:center; }
    .nav-inner { display:flex; justify-content:space-between; align-items:center; width:100%; }
    .nav-cta { background:var(--v); color:#fff; padding:10px 20px; border-radius:50px; text-decoration:none; font-weight:700; font-size:14px; }

    /* HERO */
    #home { padding-top: 120px; padding-bottom: 80px; display:grid; grid-template-columns: 1fr 1fr; align-items:center; gap: 60px; }
    h1 { font-family:'Playfair Display',serif; font-size: clamp(32px, 4vw, 56px); line-height: 1.1; margin-bottom: 20px; }
    .hero-img { width:100%; border-radius:24px; background: #ddd; min-height: 400px; }

    /* SECTIONS */
    section { padding: 80px 0; }
    h2 { font-family:'Playfair Display',serif; font-size: 36px; margin-bottom: 40px; text-align: center; }

    /* GRID FIX: Cards */
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
    .card { background: #fff; padding: 30px; border-radius: 20px; border: 1px solid var(--border); }

    /* KONTAKTFORMULAR */
    .contact-form { max-width: 600px; margin: 0 auto; background: #fff; padding: 40px; border-radius: 20px; border: 1px solid var(--border); }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; }
    input, textarea { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-family: inherit; }
    .submit-btn { background: var(--v); color: white; border: none; padding: 15px 30px; border-radius: 50px; font-weight: 700; cursor: pointer; width: 100%; }

    /* RESPONSIVE */
    @media(max-width: 768px) {
      #home { grid-template-columns: 1fr; padding-top: 100px; }
      .container { padding: 0 20px; }
      h1 { font-size: 32px; }
    }
  </style>
</head>
<body>

  <nav>
    <div class="container nav-inner">
      <a href="#" style="font-weight:700; text-decoration:none; color:var(--text);">Alltagsfreund Jenny</a>
      <a href="#kontakt" class="nav-cta">Kontakt</a>
    </div>
  </nav>

  <header id="home">
    <div class="container" style="display:grid; grid-template-columns:1fr 1fr; gap:40px; align-items:center;">
        <div class="hero-text">
            <h1>Unterstützung, die von Herzen kommt.</h1>
            <p>Ich bin für dich da – zuverlässig, nah und mit Zeit für das Wesentliche.</p>
        </div>
        <div class="hero-img"></div>
    </div>
  </header>

  <section id="kontakt">
    <div class="container">
      <h2>Lass uns sprechen</h2>
      <form class="contact-form" action="https://api.web3forms.com/submit" method="POST">
        <!-- Web3Forms Access Key -->
        <input type="hidden" name="access_key" value="DEIN-ACCESS-KEY">
        
        <div class="form-group">
          <label>Name</label>
          <input type="text" name="name" required>
        </div>
        <div class="form-group">
          <label>E-Mail</label>
          <input type="email" name="email" required>
        </div>
        <div class="form-group">
          <label>Nachricht</label>
          <textarea name="message" rows="4" required></textarea>
        </div>
        
        <!-- Honeypot zur Spamerkennung -->
        <input type="checkbox" name="botcheck" class="hidden" style="display: none;">
        
        <button type="submit" class="submit-btn">Jetzt Erstgespräch anfragen</button>
      </form>
    </div>
  </section>

</body>
</html>
